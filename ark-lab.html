<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARK Laboratory | Restricted Access</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    
    <!-- Screen Styling -->
    <div class="scanlines"></div>
    <div class="glitch-overlay"></div> 


    <div class="ark-gate" id="artGate">
      <div class="ark-gate-content">

        <!-- Ark Logo -->
        <div class="ark-logo">
          <p class="ark-logo-text">ARK</p>
          <p class="ark-logo-sub">ADVANCED RESEARCH KATALYST</p>
        </div>

        <!-- Warning -->
        <div class="ark-warning">
          ⚠ RESTRICTED NETWORK NODE DETECTED ⚠
        </div>

        <!-- Instruction -->
        <p class="ark-instruction">ENTER AUTHORIZATION CODE TO PROCEED</p>

        <!-- Input -->
        <div class="ark-input-container">
          <input 
            type="password"
            id="arkInput"
            class="ark-input"
            maxlength="10"
            placeholder="_ _ _ _ _"
            autocomplete="off">
        </div>

        <!-- Submit Button -->
        <button class="ark-submit-btn" id="arkSubmit">SUBMIT CODE</button>

        <!-- Feedback Message -->
        <div class="ark-feedback" id="arkFeedback"></div>

        <!-- Disclaimer -->
        <p class="ark-disclaimer">
          THIS NETWORK NODE IS NOT AFFILIATED WITH UMBRELLA CORPORATION.<br>
          ALL TRANSACTIONS ARE ENCRYPTED AND UNTRACEABLE. <br>
          UNAUTHORIZED ACCESS ATTEMPTS ARE LOGGED AND NEUTRALIZED.
        </p>
      </div>
    </div>
    <script>
      const overlay = document.querySelector('.glitch-overlay');
      overlay.classList.add('glitch-in');

      const SECRET_CODE = 'HOPE';

      const arkInput = document.getElementById('arkInput');
      const arkSubmit = document.getElementById('arkSubmit');
      const arkFeedback = document.getElementById('arkFeedback');
      const arkGate = document.getElementById('arkGate');

      // Allow Enter key to submit
      arkInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') checkCode();
      });

      arkSubmit.addEventListener('click', checkCode);

      function checkCode() {
        const input = arkInput.value.toUpperCase().trim();

        if (input === SECRET_CODE){

          //Correct code - access granted sequence
          arkFeedback.className = 'ark-feedback success';
          arkFeedback.textContent = '✓ CODE ACCEPTED — DECRYPTING ACCESS...';

          arkSubmit.disabled = true;
          arkInput,disabled = true;

          setTimeout(() => {
            arkFeedback.textContent = '✓ IDENTITY VERIFIED — LOADING CATALOG...'
          }, 800);

          setTimeout(() => {
            arkFeedback.textContent = '✓ WELCOME TO ARK LABORATORY...'
          }, 1600);
          
          setTimeout(() =>{
            // Glitch out then show shop
            overlay.classList.remove('glitch-in');
            overlay.classList.add('active', 'glitch-out');
            setTimeout(() => {
              window.location.href = 'ark-shop.html';
            }, 500);
          }, 2400);

        } else {

          // Wrong code - access denied
          arkFeedback.className = 'ark-feedback error';
          arkFeedback.textContent = '✗ INVALID CODE — ACCESS DENIED';

          arkInput.classList.add('shake');
          setTimeout(() => {
            arkInput.classList.remove('shake');
            arkInput.value = '';
          }, 600);
        }
      }
          // Glitch transition for any links
          document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', function(e) {
              const href = this.getAttribute('href');
              if (!href || href.startsWith('http')) return;
              e.preventDefault();
              overlay.classList.remove('glitch-in');
              overlay.classList.add('active', 'glitch-out');
              setTimeout(() => {
                window.location.href = href;
              }, 500);
            });
          });
    </script>
  </body>
</html>
